<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আমার শব্দভাণ্ডার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,400&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2F3;--ink:#14313B;--mute:#5E7480;--line:#CBD7DB;--teal:#0F6E6E;--amber:#F2B84B;--red:#B4452F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hind Siliguri",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 80px}
h1{font:600 30px/1.2 "Newsreader","Hind Siliguri",serif;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 22px}
.bar{display:flex;gap:8px}
.bar input{flex:1;font:500 20px "Newsreader",serif;padding:12px 14px;border:2px solid var(--ink);background:#fff;border-radius:6px;min-width:0}
button{font:500 15px "Hind Siliguri",sans-serif;cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:var(--ink);color:#fff}
button.ghost{background:transparent;color:var(--teal);padding:4px 0}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#msg{min-height:26px;margin:8px 0 0;color:var(--mute);font-size:14px}
#msg.err{color:var(--red)}
.tools{display:flex;gap:10px;align-items:center;margin:26px 0 6px;border-top:1px solid var(--line);padding-top:16px}
.tools input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;min-width:0}
details{border-bottom:1px solid var(--line);padding:2px 0}
summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;padding:12px 0}
summary::-webkit-details-marker{display:none}
.w{font:600 26px "Newsreader",serif}
.ph{color:var(--mute);font-size:15px}
.bn{margin-left:auto;color:var(--teal);font-weight:500}
.play{background:var(--amber);color:var(--ink);padding:6px 12px;border-radius:99px;font-size:14px}
.body{padding:0 0 18px 2px}
.def{margin:6px 0}
.pos{font:italic 400 15px "Newsreader",serif;color:var(--teal);margin-right:6px}
.lbl{font-weight:600;font-size:14px;color:var(--mute);margin:12px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:1px 10px;font-size:14px}
.ex{font:italic 400 17px/1.5 "Newsreader",serif;border-left:3px solid var(--amber);padding-left:10px;margin:6px 0}
.empty{color:var(--mute);padding:24px 0}
dialog{border:0;border-radius:10px;max-width:440px;width:92%;padding:20px}
dialog input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;margin:8px 0 14px}
</style>
</head>
<body>
<main>
<h1>আমার শব্দভাণ্ডার</h1>
<p class="sub">ইংরেজি শব্দ লিখুন। অর্থ, সমার্থক, বিপরীত শব্দ, উদাহরণ ও উচ্চারণ নিজে থেকেই আসবে এবং Google Sheet-এ সেভ হবে।</p>
<form class="bar" id="f">
  <input id="q" placeholder="যেমন: resilient" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="ইংরেজি শব্দ">
  <button type="submit">খুঁজুন ও সেভ করুন</button>
</form>
<p id="msg" role="status"></p>
<div id="latest"></div>

<div class="tools">
  <input id="s" placeholder="সেভ করা শব্দ খুঁজুন" aria-label="সেভ করা শব্দ খুঁজুন">
  <button class="ghost" id="sync">রিফ্রেশ</button>
  <button class="ghost" id="cfg">সেটিংস</button>
</div>
<div id="list"></div>
</main>

<dialog id="dlg">
  <b>Google Sheet সংযোগ</b>
  <p style="font-size:14px;color:var(--mute);margin:6px 0 0">Apps Script-এর Web app URL এখানে দিন (সেটআপ ধাপ Code.gs ফাইলের সঙ্গে দেওয়া আছে)।</p>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
  <button id="save">সেভ</button> <button class="ghost" id="close">বন্ধ করুন</button>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let words = JSON.parse(localStorage.getItem('vocab_words') || '[]');
let url = localStorage.getItem('vocab_url') || '';
const store = () => localStorage.setItem('vocab_words', JSON.stringify(words));
const say = (t, err) => { $('#msg').textContent = t; $('#msg').className = err ? 'err' : ''; };
const uniq = a => [...new Set(a)];

function tts(t){ try{ const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(_){} }
function speak(i){
  const e = words.find(x => x.word === i); if(!e) return;
  if(e.audio){ new Audio(e.audio).play().catch(() => tts(e.word)); } else tts(e.word);
}

async function lookup(w){
  const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
  if(!r.ok) throw new Error('nf');
  const data = await r.json();
  const e = {word: data[0].word, phonetic:'', audio:'', bn:'', meanings:[], synonyms:[], antonyms:[], examples:[]};
  for(const en of data){
    for(const p of en.phonetics || []){ if(!e.phonetic && p.text) e.phonetic = p.text; if(!e.audio && p.audio) e.audio = p.audio; }
    if(!e.phonetic && en.phonetic) e.phonetic = en.phonetic;
    for(const m of en.meanings || []){
      e.synonyms.push(...(m.synonyms || [])); e.antonyms.push(...(m.antonyms || []));
      for(const d of (m.definitions || []).slice(0,2)){
        e.meanings.push({pos: m.partOfSpeech, def: d.definition});
        if(d.example) e.examples.push(d.example);
        e.synonyms.push(...(d.synonyms || [])); e.antonyms.push(...(d.antonyms || []));
      }
    }
  }
  e.synonyms = uniq(e.synonyms).slice(0,8); e.antonyms = uniq(e.antonyms).slice(0,8);
  e.examples = uniq(e.examples).slice(0,4); e.meanings = e.meanings.slice(0,5);
  try{
    const t = await (await fetch('https://api.mymemory.translated.net/get?langpair=en|bn&q=' + encodeURIComponent(e.word))).json();
    const b = t.responseData && t.responseData.translatedText;
    if(b && b.toLowerCase() !== e.word.toLowerCase()) e.bn = b;
  }catch(_){}
  return e;
}

async function push(e){
  if(!url) return false;
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(e)});
  return (await r.json()).ok;
}
async function pull(){
  if(!url){ render(); return; }
  say('শিট থেকে শব্দ আনা হচ্ছে…');
  try{
    const r = await (await fetch(url)).json();
    const have = new Set(words.map(w => w.word.toLowerCase()));
    const remote = new Set(r.words.map(w => w.word.toLowerCase()));
    r.words.forEach(w => { if(!have.has(w.word.toLowerCase())) words.push(w); });
    for(const w of words.filter(w => !remote.has(w.word.toLowerCase()))) await push(w);
    store(); say('সিঙ্ক হয়েছে। মোট ' + words.length + 'টি শব্দ।');
  }catch(_){ say('শিটের সঙ্গে যুক্ত হওয়া যায়নি। সেটিংসে URL ও ডিপ্লয় অ্যাক্সেস ("Anyone") দেখুন।', true); }
  render();
}

function card(e, open){
  const m = e.meanings.map(x => `<div class="def"><span class="pos">${esc(x.pos)}</span>${esc(x.def)}</div>`).join('');
  const ch = (l, a) => a.length ? `<div class="lbl">${l}</div><div class="chips">${a.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : '';
  const ex = e.examples.length ? `<div class="lbl">উদাহরণ</div>` + e.examples.map(x => `<div class="ex">${esc(x)}</div>`).join('') : '';
  return `<details ${open ? 'open' : ''}><summary><span class="w">${esc(e.word)}</span><span class="ph">${esc(e.phonetic)}</span>
    <button type="button" class="play" data-w="${esc(e.word)}" aria-label="${esc(e.word)} উচ্চারণ শুনুন">শুনুন</button><span class="bn">${esc(e.bn)}</span></summary>
    <div class="body">${m}${ch('সমার্থক শব্দ', e.synonyms)}${ch('বিপরীত শব্দ', e.antonyms)}${ex}</div></details>`;
}
function render(){
  const k = $('#s').value.trim().toLowerCase();
  const a = words.filter(w => w.word.toLowerCase().includes(k));
  $('#list').innerHTML = a.length ? a.map(w => card(w)).join('') : `<div class="empty">${words.length ? 'কিছু পাওয়া যায়নি।' : 'এখনো কোনো শব্দ সেভ করা নেই। উপরে একটি শব্দ লিখে শুরু করুন।'}</div>`;
}

$('#f').onsubmit = async ev => {
  ev.preventDefault();
  const w = $('#q').value.trim().toLowerCase(); if(!w) return;
  say('খোঁজা হচ্ছে…'); $('#latest').innerHTML = '';
  try{
    const e = await lookup(w);
    const old = words.findIndex(x => x.word.toLowerCase() === e.word.toLowerCase());
    if(old >= 0) words.splice(old, 1);
    words.unshift(e); store();
    $('#latest').innerHTML = card(e, true); render(); speak(e.word); $('#q').value = '';
    if(!url) say('সেভ হয়েছে শুধু এই ডিভাইসে। Google Sheet-এ সেভ করতে সেটিংসে URL দিন।');
    else { say('শিটে সেভ হচ্ছে…'); (await push(e).catch(() => false)) ? say('Google Sheet-এ সেভ হয়েছে।') : say('শিটে সেভ হয়নি। পরে রিফ্রেশ চাপলে আবার চেষ্টা হবে।', true); }
  }catch(_){ say('"' + w + '" শব্দটি পাওয়া যায়নি। বানান দেখে আবার চেষ্টা করুন।', true); }
};
document.addEventListener('click', ev => { const b = ev.target.closest('.play'); if(b){ ev.preventDefault(); speak(b.dataset.w); } });
$('#s').oninput = render;
$('#sync').onclick = pull;
$('#cfg').onclick = () => { $('#url').value = url; $('#dlg').showModal(); };
$('#close').onclick = () => $('#dlg').close();
$('#save').onclick = () => { url = $('#url').value.trim(); localStorage.setItem('vocab_url', url); $('#dlg').close(); pull(); };
render(); pull();
</script>
</body>
</html>
